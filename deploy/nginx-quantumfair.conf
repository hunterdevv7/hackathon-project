# nginx on port 80 in front of gunicorn on 127.0.0.1:8000.
# Flask serves both the page (/) and the API, so nginx forwards everything and adds
# what a public server needs: per-client rate limits, size limits and security
# headers. Installed to /etc/nginx/sites-available/quantumfair by deploy/setup.sh.

# Per-client request budgets, keyed by IP. A quantum draw costs real CPU on a
# 1-vCPU box, so the API gets a tighter budget than the page and its assets.
# A demo user makes a few requests per second at most; a flood gets HTTP 429.
limit_req_zone  $binary_remote_addr zone=qf_api:10m  rate=10r/s;
limit_req_zone  $binary_remote_addr zone=qf_page:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=qf_conn:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;              # don't advertise the nginx version
    client_max_body_size 64k;       # the largest API body (1024 bits) is ~5 KB
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn qf_conn 20;

    # Security headers. The page has no inline scripts, so scripts are 'self' only.
    # Inline style="" attributes and Google Fonts are the only exceptions.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Shared by every location below.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Errors nginx raises itself come back as JSON, like the API's own errors.
    error_page 413 @too_large;
    error_page 429 @too_many;
    location @too_large { default_type application/json; return 413 '{"error":"Request Entity Too Large"}'; }
    location @too_many  { default_type application/json; return 429 '{"error":"Too Many Requests"}'; }

    # Never serve dotfiles (.env, .git, ...) whatever path they end up under.
    location ~ /\. { return 404; }

    # The API: tighter budget, bursts allowed for a page that fires a few calls per click.
    location ~ ^/(health|engine|quantum-draw|quantum-state|classical-draw|stat-test|attack)(/|$) {
        limit_req zone=qf_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # The page and its assets.
    location / {
        limit_req zone=qf_page burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
}
